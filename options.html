<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WoW Armory Lite Options</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="options-page">
    <h1>WoW Armory Lite options</h1>
    <p>Choose the default character shown when the extension opens.</p>

    <form class="options-form" id="options-form">
      <label>
        <span>Region</span>
        <select id="region" name="region">
          <option value="eu">Europe</option>
          <option value="us">North America</option>
          <option value="kr">Korea</option>
          <option value="tw">Taiwan</option>
        </select>
      </label>
      <label>
        <span>Locale</span>
        <select id="locale" name="locale">
          <option value="fr-fr">Français</option>
          <option value="en-us">English US</option>
          <option value="en-gb">English EU</option>
          <option value="de-de">Deutsch</option>
          <option value="es-es">Español EU</option>
          <option value="es-mx">Español LATAM</option>
          <option value="it-it">Italiano</option>
          <option value="pt-br">Português BR</option>
          <option value="ru-ru">Русский</option>
          <option value="ko-kr">한국어</option>
          <option value="zh-tw">繁體中文</option>
        </select>
      </label>
      <label>
        <span>Realm slug</span>
        <input id="realm" name="realm" type="text" placeholder="archimonde">
      </label>
      <label>
        <span>Character name</span>
        <input id="character" name="character" type="text" placeholder="Poilgrês">
      </label>
      <button type="submit">Load</button>
    </form>

    <p class="status" id="status" role="status"></p>
  </main>

  <script src="browser-polyfill.js"></script>
  <script src="shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
